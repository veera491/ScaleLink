apiVersion: v1
kind: Service
metadata:
  name: scalelink-postgres
  namespace: scalelink
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: scalelink
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: scalelink
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
