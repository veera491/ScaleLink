apiVersion: v1
kind: Service
metadata:
  name: scalelink-link
  namespace: scalelink
  labels:
    app.kubernetes.io/name: scalelink-link
    app.kubernetes.io/component: link-service
    app.kubernetes.io/part-of: scalelink
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: scalelink-link
    app.kubernetes.io/component: link-service
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30080
