apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scalelink-link
  namespace: scalelink
  labels:
    app.kubernetes.io/name: scalelink-link
    app.kubernetes.io/part-of: scalelink
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scalelink-link
  minReplicas: 1
  maxReplicas: 3
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
